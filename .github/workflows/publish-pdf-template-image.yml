name: Publish PDF Template Image

on:
  push:
    tags:
      - "e2b-pdf-to-markdown-langchain/v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: "0.0.1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2b-pdf-to-markdown-langchain
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            image_tag="$INPUT_TAG"
          else
            image_tag="${GITHUB_REF_NAME#e2b-pdf-to-markdown-langchain/v}"
          fi
          test -n "$image_tag"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: e2b-pdf-to-markdown-langchain/template
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/document-conversion-template:${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
