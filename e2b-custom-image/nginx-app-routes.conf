# 业务路由（server 级），代表「你自己的镜像原本就有的那些 location」。
#
# 这里故意留了一条 `location = /health { return 200 ... }`：
# 它是 envd 集成里最经典的抢答陷阱，靠 http.d/00-multiport.conf 里的
# rewrite_by_lua_no_postpone on 才能保证带端口信息的请求先被 multiport 劫持。

location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"my-app-nginx"}';
}

location / {
    # 固定指向 8000，和 app.py 的 APP_PORT 是同一个约定；换业务端口要两处一起改。
    proxy_pass http://127.0.0.1:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
