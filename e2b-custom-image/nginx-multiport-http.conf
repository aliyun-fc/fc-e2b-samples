# 多端口动态路由的 http 级配置（被 nginx.conf 的 http 块 include）。

# WebSocket upgrade 映射，供 location @multiport 使用
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 让 rewrite_by_lua 先于 ngx_rewrite 的 return/rewrite 指令执行。
#
# 少了这一行，带端口信息的请求会被业务自己的
# `location = /health { return 200 ... }` 抢先应答：
# envd 的 /health 本该返回 204，实际会拿到业务的 200 —— 静默走错分支。
# 同目录 nginx-app-routes.conf 里就有这样一条 /health，
# 本地验证脚本会同时断言「带端口 → 204(envd)」和「不带端口 → 200(业务)」。
rewrite_by_lua_no_postpone on;
