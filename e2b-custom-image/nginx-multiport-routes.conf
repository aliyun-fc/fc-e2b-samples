# 多端口动态路由（server 级：本文件被 nginx.conf 的 server 块 include）。
#
# 沙箱网关把所有入站流量都打到容器的 5000 端口，真正的目标端口通过
# `{port}-<sandbox-id>.<domain>` 的 Host 前缀或 X-Sandbox-Port 头传递，
# 由容器内 nginx 转发到 127.0.0.1:{port}。envd 的 49983 也走这条路。
#
# 文件名 00- 前缀保证先于 10-app-routes.conf 被 include。

# ngx.var 赋值前变量必须先声明
set $target_port "";

# 放在 server 级 → 所有 location 继承 → 带端口信息的请求能在
# location = /health、location / 这些精确/前缀路由之前被劫持。
rewrite_by_lua_block {
    local port = ngx.var.http_x_sandbox_port
    if not port or port == "" then
        port = string.match(ngx.var.host or "", "^(%d+)%-")
    end
    if not port then
        return
    end
    local port_num = tonumber(port)
    -- 下界按需收紧：这里只放开非特权端口，避免把 22/25 这类内部服务暴露到公网。
    -- 这里放行的是 8000（业务）和 49983（envd）。
    if not port_num or port_num < 1024 or port_num > 65535 then
        return
    end
    ngx.var.target_port = port
    ngx.exec("@multiport")
}

location @multiport {
    # 必须覆盖掉继承来的 server 级 rewrite_by_lua_block，
    # 否则内部重定向进来后又会 ngx.exec 一次，形成重定向死循环。
    rewrite_by_lua_block {
        return
    }

    proxy_pass http://127.0.0.1:$target_port;

    proxy_set_header Host localhost:$target_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    # envd 用 connect 协议：需要 HTTP/1.1 且关闭缓冲，否则流式接口会挂住
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
}
