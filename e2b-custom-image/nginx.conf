# openresty 主配置：从零写给自定义镜像用的配置。
#
# 相对「随便一份 nginx.conf」，只有两处是沙箱强制要求的：
#   ① server 块 listen 0.0.0.0:5000      —— 网关只往容器的 5000 打流量
#   ② include 那两份 multiport 配置       —— 让 49983 的流量能穿过 nginx 到 envd
# 其余（worker/log/temp path）都是常规配置。

worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/lib/openresty/openresty.pid;

events {
    worker_connections  1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout  combined;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # 容器里 /usr/local/openresty/nginx 目录只读更安全，临时目录统一放到可写的 prefix 下
    client_body_temp_path  /var/lib/openresty/client_body_temp;
    proxy_temp_path        /var/lib/openresty/proxy_temp;
    fastcgi_temp_path      /var/lib/openresty/fastcgi_temp;
    uwsgi_temp_path        /var/lib/openresty/uwsgi_temp;
    scgi_temp_path         /var/lib/openresty/scgi_temp;

    # ② 多端口路由的 http 级部分（map $connection_upgrade + rewrite_by_lua_no_postpone）
    include /etc/openresty/http.d/*.conf;

    server {
        # ① 网关只认 5000。少了这一行，Sandbox.create 会卡 ~121s 后失败，
        #    且沙箱记录都不会生成 —— 与 envd 本身无关。
        listen 0.0.0.0:5000;
        server_name _;

        # 多端口路由（00-）必须排在业务路由（10-）之前被 include
        include /etc/openresty/conf.d/*.conf;
    }
}
