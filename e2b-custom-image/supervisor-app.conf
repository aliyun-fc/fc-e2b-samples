# 示例业务进程 —— 换成你自己的服务即可。和 envd 无关，这里只是为了验证
# 「多端口路由既能转 envd，也不影响业务」。
#
# python3 -u：不缓冲 stdout，否则日志要攒满 4KB 才出现，看起来像进程没在跑。

[program:my-app]
command=python3 -u /usr/local/lib/myapp/app.py
autostart=true
autorestart=true
startsecs=1
startretries=1000000
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
priority=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
