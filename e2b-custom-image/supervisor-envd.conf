# envd —— 沙箱的命脉：SDK 的 commands.run / files 全部经它执行，它挂了整个沙箱失能。
#
# 这个文件就是可以直接搬进你自己镜像的那一份：
#     COPY supervisor-envd.conf /etc/supervisor/conf.d/10-envd.conf
# 镜像已经在用 supervisord 的话，其他配置一行都不用改。
#
# 整行 `;` 注释，不要写行尾注释（supervisord 不剥行尾注释，会连注释一起当成值）。

[program:envd]
command=/usr/local/bin/envd
autostart=true
autorestart=true
; 存活 1s 以上才算启动成功
startsecs=1
; supervisord 没有「无限重试」，给一个大到不可能耗尽的值。
; 千万不要用默认的 startretries=3：envd 连续快速失败 3 次后会进 FATAL 并永不再拉起，
; 而那正是 process-compose 的 `restart: always` 明确要避免的语义。
; 表现会是「沙箱前几分钟好的，之后所有 SDK 调用 502」，极难排查。
startretries=1000000
stopsignal=TERM
stopwaitsecs=10
; 连同 envd fork 出来的子进程（commands.run 起的用户进程）一起收掉，避免残留
stopasgroup=true
killasgroup=true
; 先于反代和业务进程启动
priority=10
; 日志转发到容器 stdout，docker logs / 沙箱日志里直接可见
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
