# openresty —— 唯一对外的进程：listen 0.0.0.0:5000，按 Host 端口前缀把流量转给
# envd(49983) 或业务进程(8000)。网关只往 5000 打，所以它挂了沙箱同样失能。
#
# `daemon off;` 必须加：让 openresty 前台运行，否则 supervisord 会以为它秒退并反复重启。

[program:openresty]
command=/usr/local/openresty/bin/openresty -p /var/lib/openresty -c /etc/openresty/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=1
startretries=1000000
; nginx/openresty 的优雅退出信号是 QUIT（TERM 是立即退出）
stopsignal=QUIT
stopwaitsecs=10
priority=20
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
