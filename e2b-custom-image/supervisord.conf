# supervisord 主配置。
#
# 生产做法：三个进程（envd / openresty / 业务进程）都交给进程管理器，
# entrypoint 只做目录准备，然后 exec supervisord —— 由它当 PID 1，
# 负责信号转发、僵尸回收和崩溃重启。
#
# 每个进程一个文件放在 conf.d/ 下。这样做的好处是可移植：
# 已经在用 supervisord 的镜像，集成 envd 只需要
#     COPY supervisor-envd.conf /etc/supervisor/conf.d/10-envd.conf
# 主配置和其他进程定义完全不用动。
#
# 注意：本文件只用整行 `;` 注释。supervisord 不会剥掉值后面的行尾注释，
# `nodaemon=true  ; 前台` 会让它把整串当成值。

[supervisord]
; 前台运行：容器里必须，否则 PID 1 立刻退出、容器直接结束
nodaemon=true
; supervisord 自身日志不落盘；各进程日志转发到容器 stdout（沙箱是临时的，落盘白占 rootfs）
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root
loglevel=info

; unix socket + supervisorctl：沙箱里一条 `supervisorctl status` 就能看出谁挂了、
; 重启过几次，排错比 ps -ef 直接得多
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files = /etc/supervisor/conf.d/*.conf
